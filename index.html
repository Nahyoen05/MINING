<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>슬라임 광산</title>
<style>
*{box-sizing:border-box;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
body{margin:0;background:#1d1b26;display:flex;flex-direction:column;align-items:center;color:#4a3b32}
img{image-rendering:pixelated}
#stage{position:relative;width:min(100vw,calc(100vh*1.7778));aspect-ratio:16/9;overflow:hidden;background:linear-gradient(#4b4a63,#5c5a73 55%,#7b6f66 55%,#6a5f58);margin-top:8px;image-rendering:pixelated}
.obj{position:absolute;bottom:9%;cursor:pointer;transition:transform .08s}
.obj:hover{filter:brightness(1.12)}
#ore{left:0;width:25%}#pl{left:16%;width:26%}#fu{left:42%;width:23%}#inc{left:63%;width:17%}#gem{left:79%;width:20%;cursor:not-allowed}
#ore.hit{transform:scale(.95)}
#mbar{position:absolute;left:4%;bottom:6%;width:18%;height:1.2%;background:#0006;border-radius:9px;overflow:hidden}
#mbar i{display:block;height:100%;width:0;background:#7be08a}
#gb{position:absolute;left:1.5%;top:2.5%;background:#f3e9d8;border:3px solid #cbb89c;border-radius:14px;padding:.4em 1em;font-size:clamp(14px,2.4vw,28px)}
#top{position:absolute;right:1.5%;top:2%;display:flex;gap:1%}
.mb{background:none;border:0;cursor:pointer;text-align:center;font-size:clamp(10px,1.4vw,16px);color:#fff;padding:0}
.mb img{width:clamp(40px,7vw,86px);display:block}
#bot{position:absolute;left:2%;bottom:1.5%;display:flex;gap:2%}
.fl{position:absolute;color:#fff;font-weight:bold;text-shadow:0 1px 3px #000;pointer-events:none;animation:up 1s forwards;font-size:clamp(12px,1.8vw,20px)}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:.5em 1.2em;border-radius:20px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}
#md{background:#f6efe3;border:4px solid #cbb89c;border-radius:18px;width:min(96vw,720px);max-height:92vh;overflow:auto;padding:14px 18px;position:relative}
#md h2{margin:0 0 10px}#x{position:absolute;right:10px;top:8px;border:0;background:#bba;border-radius:8px;font-size:20px;cursor:pointer}
h3{margin:10px 0 6px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,.mat,.cell{background:#fff8;border:2px solid #d8c9b0;border-radius:10px;padding:6px;text-align:center;font-size:13px;cursor:pointer}
.chip img{width:48px}.mat{cursor:default;min-width:70px}.mat img{width:40px;display:block;margin:auto}
.chip.on{border-color:#6aa36a;background:#dff0d8}.lack{color:#c0392b}
.cell{width:100px;cursor:default}.cell img{width:48px}
button.go,button.sm{background:#8fcf8f;border:2px solid #6aa36a;border-radius:10px;padding:8px 18px;font-weight:bold;cursor:pointer;margin-top:8px}
button.sm{padding:2px 8px;font-size:12px;margin:2px;background:#e8d9b8;border-color:#cbb89c}
button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:8px;border:2px solid #cbb89c;border-radius:10px 10px 0 0;background:#e8dcc6;font-weight:bold;cursor:pointer}.tabs .on{background:#fff}
.bar{height:14px;background:#0003;border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:0;background:#6aa36a}
.rs{text-align:center;font-size:12px;color:#fff8;padding:6px}
</style></head><body>
<div id="stage">
  <div id="gb">🪙 <b id="gold">0</b></div>
  <div id="top">
    <button class="mb" onclick="soon('의뢰소')"><img data-i="메뉴바/의뢰소">의뢰소</button>
    <button class="mb" onclick="soon('상점')"><img data-i="메뉴바/상점">상점</button>
    <button class="mb" onclick="soon('설정')"><img data-i="메뉴바/설정">설정</button>
  </div>
  <img id="ore" class="obj" data-i="플레이어/광석" onclick="clickOre()">
  <img id="pl" class="obj" onclick="openM('pl')">
  <img id="fu" class="obj" onclick="openM('fu')">
  <img id="inc" class="obj" onclick="openM('inc')">
  <img id="gem" class="obj" data-i="보석 세공/보석 세공하는 곳" onclick="soon('보석 세공대')">
  <div id="mbar"><i id="mb2"></i></div>
  <div id="bot">
    <button class="mb" onclick="openM('work')"><img data-i="메뉴바/곡괭이 제작강화">곡괭이 제작/강화</button>
    <button class="mb" onclick="openM('inv')"><img data-i="메뉴바/가방">보관함</button>
  </div>
</div>
<div class="rs"><a href="#" onclick="if(confirm('저장 데이터를 모두 지울까요?')){localStorage.removeItem(KEY);location.reload()}return false" style="color:#fff8">데이터 초기화</a></div>
<div id="toast"></div>
<div id="ov" onclick="if(event.target===this)closeM()"><div id="md"><button id="x" onclick="closeM()">✕</button><h2 id="mh"></h2><div id="mbody"></div></div></div>

<script>
/* ===== 이미지 경로 설정 =====
   깃허브 저장소 루트에 images 폴더를 만들고, 그 안에 '이미지 소스' 안의 폴더들을 그대로 넣으면 됨 */
const IMG='images/', KEY='slimemine_v1';
const BG='배경/배경'; // → images/배경/배경.png (배경 파일 위치/이름이 다르면 여기만 수정)
const src=p=>IMG+encodeURI(p)+'.png';
const $=id=>document.getElementById(id), rnd=(a,b)=>a+Math.random()*(b-a);
const TN=['나무','돌','철','금','다이아'];
/* 아이템: [이미지경로, 판매가] */
const IT={'나무':['곡괭이 재료/나무',3],'돌':['곡괭이 재료/돌',2],'석탄':['광질/석탄',5],'구리 광석':['광질/구리 광석',12],'주석 광석':['광질/주석 광석',12],'철 광석':['광질/철 광석',18],'금 광석':['광질/금 광석',30],'자수정':['광질/자수정',60],'루비':['광질/루비',90],'에메랄드':['광질/애메랄드',90],'다이아':['곡괭이 재료/다이아',200],'구리 주괴':['광질/구리 주괴',35],'주석 주괴':['광질/주석 주괴',35],'철 주괴':['곡괭이 재료/철',55],'금 주괴':['곡괭이 재료/금',100],'강화 스크롤':['스크롤/강화 스크롤',50],'파괴 방지 스크롤':['스크롤/파괴 방지 스크롤',150]};
/* 채굴표: [아이템, 필요 곡괭이 단계(0~4), 가중치] */
const ORES=[['나무',0,5],['돌',0,40],['석탄',0,20],['구리 광석',1,20],['주석 광석',1,15],['철 광석',2,15],['금 광석',3,8],['자수정',3,5],['루비',4,4],['에메랄드',4,4],['다이아',4,3]];
const SM={'구리 광석':'구리 주괴','주석 광석':'주석 주괴','철 광석':'철 주괴','금 광석':'금 주괴'};
const RC=[{m:{'나무':5},g:100},{m:{'돌':10,'나무':3},g:200},{m:{'철 주괴':5,'나무':3},g:500},{m:{'금 주괴':5,'철 주괴':2},g:1000},{m:{'다이아':5,'금 주괴':3},g:3000}];
const SL={'풀':['제련 시 25% 확률로 주괴 +1',1,.25],'불':['제련 속도 ×2',2,0],'물':['제련 속도 ×1.5',1.5,0],'바람':['제련 속도 ×1.3 + 10% 확률 주괴 +1',1.3,.1]};
const EGG=30, MAXLV=10;
const newPk=t=>({t,lv:0,st:{s:0,l:0,d:0,u:0}});
let S={gold:500,inv:{'강화 스크롤':2,'파괴 방지 스크롤':1},pk:[newPk(0)],eq:0,g:'여자',sl:{'풀':1,'불':0,'물':0,'바람':0},fs:'풀',fon:true,fp:0,ia:false,ip:-1,mp:0,ct:0,es:0,wt:'craft',su:false,ss:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
let M=null;
const has=k=>S.inv[k]||0, add=(k,n)=>S.inv[k]=has(k)+n;
const spd=p=>(1+.4*p.t)*(1+.12*p.lv)*(1+p.st.s/100);
const pkn=p=>`${TN[p.t]} 곡괭이 +${p.lv}`;
const er=p=>Math.min(100,Math.max(10,95-p.lv*9)+p.st.l+(S.su&&has('강화 스크롤')?15:0));
const dr=p=>(S.ss&&has('파괴 방지 스크롤'))?0:Math.max(0,(p.lv-2)*4-p.st.u);
const cost=p=>100*(p.lv+1)*(p.t+1);
const ic=(p,c='')=>`<img class="${c}" src="${src(p)}" width="40">`;

function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2000)}
function soon(n){toast(n+'은(는) 아직 준비 중이에요')}
function fl(t){const s=document.createElement('span');s.className='fl';s.textContent=t;s.style.left=rnd(6,22)+'%';s.style.bottom='42%';$('stage').appendChild(s);setTimeout(()=>s.remove(),1000)}
function setI(id,p){const e=$(id),s=src(p);if(e.dataset.s!==s){e.dataset.s=s;e.src=s}}

/* ===== 채굴 ===== */
function mined(){const p=S.pk[S.eq],pool=ORES.filter(o=>o[1]<=p.t);let r=rnd(0,pool.reduce((a,o)=>a+o[2],0)),o=pool[0];
  for(const x of pool){if((r-=x[2])<=0){o=x;break}}
  const n=1+(Math.random()*100<p.st.d?1:0);add(o[0],n);fl('+'+o[0]+(n>1?' ×2':''));S.mp=0}
function clickOre(){S.mp+=.15;const e=$('ore');e.classList.add('hit');setTimeout(()=>e.classList.remove('hit'),80);if(S.mp>=1)mined()}

/* ===== 메인 루프 (0.1초) ===== */
let fon=false;
function tick(){const dt=.1,p=S.pk[S.eq];
  S.mp+=dt*.35*spd(p);if(S.mp>=1)mined();
  // 화로
  const ore=Object.keys(SM).find(k=>has(k)>0),fx=SL[S.fs];fon=!!(S.fon&&ore);
  if(fon){S.fp+=dt*fx[1]/2;if(S.fp>=1){S.fp=0;add(ore,-1);add(SM[ore],1+(Math.random()<fx[2]?1:0))}}
  // 부화기
  if(S.ip<0&&S.ia&&S.gold>=EGG){S.gold-=EGG;S.ip=0}
  if(S.ip>=0){S.ip+=dt/15;if(S.ip>=1){const k=Object.keys(S.sl)[Math.floor(rnd(0,4))];S.sl[k]++;S.ip=-1;toast(k+' 슬라임이 부화했어요!');rend()}}
  paint();
}
function paint(){
  $('gold').textContent=S.gold.toLocaleString();
  const p=S.pk[S.eq];
  setI('pl','플레이어/기본 '+S.g+'/'+TN[p.t]);
  setI('fu','화로/'+S.fs+'_'+(fon?'on':'off'));
  setI('inc',S.ip>=0?'슬라임 부화기/부화기 (알 있음)':'슬라임 부화기/부화기');
  $('mb2').style.width=S.mp*100+'%';
  const pb=$('pb');if(pb&&M==='fu')pb.style.width=S.fp*100+'%';
  if(pb&&M==='inc')pb.style.width=Math.max(0,S.ip)*100+'%';
}
setInterval(tick,100);
setInterval(()=>localStorage.setItem(KEY,JSON.stringify(S)),3000);

/* ===== 팝업 ===== */
const TITLE={work:'곡괭이 제작 / 강화',inv:'보관함',fu:'화로 (자동 제련)',inc:'슬라임 부화기',pl:'플레이어'};
function openM(m){M=m;$('mh').textContent=TITLE[m];$('ov').style.display='flex';rend()}
function closeM(){M=null;$('ov').style.display='none'}
function rend(){if(!M)return;$('mbody').innerHTML=({work:pWork,inv:pInv,fu:pFu,inc:pInc,pl:pPl})[M]()}

function pInv(){const ks=Object.keys(IT).filter(k=>has(k)>0);
  if(!ks.length)return '<p>아직 가진 아이템이 없어요. 광석을 캐 보세요!</p>';
  return `<p style="font-size:12px">※ 상점이 구현되기 전까지 임시로 여기서 판매할 수 있어요.</p><div class="row">${ks.map(k=>`<div class="cell">${ic(IT[k][0])}<br><b>${k}</b><br>×${has(k)}<br>🪙${IT[k][1]}<br><button class="sm" onclick="sell('${k}',0)">1개</button><button class="sm" onclick="sell('${k}',1)">전체</button></div>`).join('')}</div>`}
function sell(k,all){const n=all?has(k):1;if(n<=0)return;S.gold+=n*IT[k][1];add(k,-n);rend()}

function pWork(){const t=S.wt;return `<div class="tabs"><button class="${t=='craft'?'on':''}" onclick="S.wt='craft';rend()">곡괭이 제작</button><button class="${t=='enh'?'on':''}" onclick="S.wt='enh';rend()">곡괭이 강화</button></div>`+(t=='craft'?pCraft():pEnh())}
function pCraft(){const r=RC[S.ct],ok=Object.keys(r.m).every(k=>has(k)>=r.m[k])&&S.gold>=r.g;
  return `<div class="row">${TN.map((n,i)=>`<div class="chip ${i==S.ct?'on':''}" onclick="S.ct=${i};rend()"><img src="${src('곡괭이/'+n+' 곡괭이')}"><br>${n} 곡괭이</div>`).join('')}</div>
  <h3>제작 재료</h3><div class="row">${Object.entries(r.m).map(([k,v])=>`<div class="mat ${has(k)>=v?'':'lack'}">${ic(IT[k][0])}${k}<br>${has(k)}/${v}</div>`).join('')}<div class="mat ${S.gold>=r.g?'':'lack'}"><span style="font-size:30px">🪙</span><br>${S.gold}/${r.g}</div></div>
  <button class="go" ${ok?'':'disabled'} onclick="craft()">제작하기</button>`}
function craft(){const r=RC[S.ct];if(!Object.keys(r.m).every(k=>has(k)>=r.m[k])||S.gold<r.g)return;
  for(const k in r.m)add(k,-r.m[k]);S.gold-=r.g;S.pk.push(newPk(S.ct));toast(TN[S.ct]+' 곡괭이를 제작했어요!');rend()}

const SN=[['채굴 속도','s'],['행운 (성공 확률)','l'],['광물 드롭 확률','d'],['내구도 (파괴 확률↓)','u']];
function pEnh(){if(S.es>=S.pk.length)S.es=0;const p=S.pk[S.es],c=cost(p),mx=p.lv>=MAXLV;
  return `<div class="row">${S.pk.map((q,i)=>`<div class="chip ${i==S.es?'on':''}" onclick="S.es=${i};rend()"><img src="${src('곡괭이/'+TN[q.t]+' 곡괭이')}"><br>+${q.lv}${i==S.eq?' ⛏장착':''}</div>`).join('')}</div>
  <h3>${pkn(p)} ${mx?'(최대 단계)':'→ +'+(p.lv+1)}</h3>
  <div class="row">${SN.map(([n,k])=>`<div class="mat">${n}<br><b>${p.st[k]>0?'+'+p.st[k]+'%':'?'}</b></div>`).join('')}</div>
  <h3>강화 옵션</h3><div class="row"><div class="mat">성공 확률<br><b>${er(p)}%</b></div><div class="mat">파괴 확률<br><b>${dr(p)}%</b></div><div class="mat ${S.gold>=c?'':'lack'}">비용<br><b>🪙${c}</b></div></div>
  <h3>사용할 스크롤 (선택)</h3><div class="row">
  <label class="mat">${ic(IT['강화 스크롤'][0])}강화 확률 업 +15%p<br>보유 ${has('강화 스크롤')} <input type="checkbox" ${S.su?'checked':''} ${has('강화 스크롤')?'':'disabled'} onchange="S.su=this.checked;rend()"></label>
  <label class="mat">${ic(IT['파괴 방지 스크롤'][0])}파괴 방지<br>보유 ${has('파괴 방지 스크롤')} <input type="checkbox" ${S.ss?'checked':''} ${has('파괴 방지 스크롤')?'':'disabled'} onchange="S.ss=this.checked;rend()"></label></div>
  <button class="go" ${mx||S.gold<c?'disabled':''} onclick="enh()">강화하기</button><p style="font-size:12px">스크롤을 사용하지 않아도 강화할 수 있습니다.</p>`}
function enh(){const p=S.pk[S.es],c=cost(p);if(p.lv>=MAXLV||S.gold<c)return;
  const us=S.su&&has('강화 스크롤'),ud=S.ss&&has('파괴 방지 스크롤'),rt=er(p),ds=dr(p);
  S.gold-=c;if(us)add('강화 스크롤',-1);if(ud)add('파괴 방지 스크롤',-1);
  if(Math.random()*100<rt){p.lv++;const k='sldu'[Math.floor(rnd(0,4))];p.st[k]+=Math.round(rnd(1,4));toast('강화 성공! +'+p.lv+' (랜덤 속성 상승)')}
  else if(Math.random()*100<ds){S.pk.splice(S.es,1);if(!S.pk.length)S.pk.push(newPk(0));
    if(S.eq===S.es)S.eq=0;else if(S.eq>S.es)S.eq--;S.es=0;toast('💥 곡괭이가 파괴됐어요…')}
  else toast('강화 실패… 단계는 그대로예요');
  if(S.su&&!has('강화 스크롤'))S.su=false;if(S.ss&&!has('파괴 방지 스크롤'))S.ss=false;rend()}

function pFu(){const ore=Object.keys(SM).map(k=>`${k} ${has(k)}`).join(' / ');
  return `<p>사용할 슬라임 (보유한 슬라임만 선택 가능)</p><div class="row">${Object.keys(SL).map(k=>`<div class="chip ${k==S.fs?'on':''}" style="${S.sl[k]?'':'opacity:.4'}" onclick="setFS('${k}')"><img src="${src('화로/'+k+'_off')}" width="64"><br>${k} 슬라임 ×${S.sl[k]}</div>`).join('')}</div>
  <p>효과: <b>${SL[S.fs][0]}</b></p><p style="font-size:13px">제련 대기 광석: ${ore}</p>
  <div class="bar"><i id="pb"></i></div>
  <button class="go" onclick="S.fon=!S.fon;rend()">자동 제련: ${S.fon?'켜짐 (끄기)':'꺼짐 (켜기)'}</button>`}
function setFS(k){if(!S.sl[k]){toast(k+' 슬라임이 없어요. 부화기에서 얻어 보세요!');return}S.fs=k;rend()}

function pInc(){return `<div style="text-align:center"><img src="${src(S.ip>=0?'슬라임 부화기/부화기 (알 있음)':'슬라임 부화기/부화기')}" width="140"></div>
  <p>알 1개당 🪙${EGG} / 부화 시간 15초 / 슬라임 종류는 무작위</p><div class="bar"><i id="pb"></i></div>
  <button class="go" ${S.ip>=0||S.gold<EGG?'disabled':''} onclick="hatch()">부화 시작</button>
  <button class="go" onclick="S.ia=!S.ia;rend()">자동 부화: ${S.ia?'켜짐 (끄기)':'꺼짐 (켜기)'}</button>
  <p>보유 슬라임: ${Object.entries(S.sl).map(([k,v])=>k+' '+v).join(' / ')}</p>`}
function hatch(){if(S.ip>=0||S.gold<EGG)return;S.gold-=EGG;S.ip=0;rend()}

function pPl(){return `<div class="row"><b>캐릭터</b>${['여자','남자'].map(g=>`<div class="chip ${g==S.g?'on':''}" onclick="S.g='${g}';rend()">${g}</div>`).join('')}</div>
  <h3>들고 있는 곡괭이</h3><div class="row">${S.pk.map((q,i)=>`<div class="chip ${i==S.eq?'on':''}" onclick="S.eq=${i};S.mp=0;rend()"><img src="${src('곡괭이/'+TN[q.t]+' 곡괭이')}"><br>${pkn(q)}<br>채굴 ×${spd(q).toFixed(2)}</div>`).join('')}</div>`}

document.querySelectorAll('[data-i]').forEach(e=>e.src=src(e.dataset.i));
$('stage').style.background=`url("${src(BG)}") center/cover no-repeat,linear-gradient(#4b4a63,#5c5a73 55%,#7b6f66 55%,#6a5f58)`;
tick();
</script></body></html>
